    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最终定稿 - 完美生态循环版</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #408cff; }
        canvas { display: block; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

    // ==========================================
    // 1. 核心参数
    // ==========================================
    const PARAMS = {
        gravity: 0.90,       
        airResistance: 0.09, 
        mouseLag: 0.25,      
        mouseRadius: 20,     
        
        // --- 动画参数 ---
        growSpeed: 1.02,     // 变大速度
        shrinkSpeed: 0.90,   // 缩小速度
        maxPopScale: 1.15,   // 最大膨胀倍数
        hoverScale: 1.15,    // 鼠标悬停膨胀倍数
        
        // --- 生态参数 ---
        maxCount: 100,       // 屏幕最大容纳数量 (堆积感)
        crowdThreshold: 60,  // "拥挤"阈值：超过这个数量就开始随机清理
        
        pulseSpeed: 0.1,     
        pulseMaxScale: 1.2   
    };

        fill: '#FDFAF2',     
        fillHover: '#FF6B6B', // 红色
        width: 1.2,

        `<g class="head-group"><path d="M47,6 C 67,8 84,20 90,43 C 95,66 85,86 66,95 C 46,102 24,93 12,78 C 2,60 5,38 18,22 C 26,12 37,5 47,6" fill="${fillColor}" stroke="${CONFIG.stroke}" stroke-width="${CONFIG.width}" stroke-linecap="round" stroke-linejoin="round"/></g><g class="features-group"><path d="M35,40 L40,40 M70,40 L75,40" fill="none" stroke="${CONFIG.stroke}" stroke-width="${CONFIG.width * 1.3}" stroke-linecap="butt" stroke-linejoin="round"/><path d="M35,70 L75,60" fill="none" stroke="${CONFIG.stroke}" stroke-width="${CONFIG.width}" stroke-linecap="round" stroke-linejoin="round"/></g>`,
        `<g class="head-group"><path d="M50,9 C 70,11 86,24 92,47 C 97,70 86,90 68,98 C 48,105 26,96 14,80 C 4,62 7,40 20,24 C 28,14 40,8 50,9" fill="${fillColor}" stroke="${CONFIG.stroke}" stroke-width="${CONFIG.width}" stroke-linecap="round" stroke-linejoin="round"/></g><g class="features-group"><path d="M30,40 L45,45 L30,50 M80,40 L65,45 L80,50" fill="none" stroke="${CONFIG.stroke}" stroke-width="${CONFIG.width}" stroke-linecap="round" stroke-linejoin="round"/><path d="M30,75 C40,60 70,60 80,75 C75,85 35,85 30,75 Z" fill="none" stroke="${CONFIG.stroke}" stroke-width="${CONFIG.width}" stroke-linecap="round" stroke-linejoin="round"/><path d="M15,20 C20,15 25,15 30,20 M80,20 C85,15 90,15 95,20" fill="none" stroke="${CONFIG.stroke}" stroke-width="${CONFIG.width * 0.7}" stroke-linecap="round" stroke-linejoin="round"/></g>`,
        `<g class="head-group"><path d="M60,7 C 80,9 96,22 102,45 C 107,68 97,88 78,96 C 58,103 36,94 24,78 C 14,60 17,38 30,22 C 38,12 50,6 60,7" fill="${fillColor}" stroke="${CONFIG.stroke}" stroke-width="${CONFIG.width}" stroke-linecap="round" stroke-linejoin="round"/></g><g class="features-group"><path d="M45,45 L50,45 M80,45 L85,45" fill="none" stroke="${CONFIG.stroke}" stroke-width="${CONFIG.width * 1.3}" stroke-linecap="butt" stroke-linejoin="round"/><path d="M55,70 C60,65 75,65 80,70 C75,75 60,75 55,70 Z" fill="none" stroke="${CONFIG.stroke}" stroke-width="${CONFIG.width}" stroke-linecap="round" stroke-linejoin="round"/></g><g class="features-group utensils"><path d="M20,30 C15,30 15,50 20,55 L20,90" fill="none" stroke="${CONFIG.stroke}" stroke-width="${CONFIG.width}" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-10 20 50)"/><path d="M110,30 L110,55 M100,30 L100,55 M120,30 L120,55 M100,55 C110,65 120,55 110,55 L110,90" fill="none" stroke="${CONFIG.stroke}" stroke-width="${CONFIG.width}" stroke-linecap="round" stroke-linejoin="round" transform="rotate(10 110 50)"/></g>`,
        `<g class="head-group"><path d="M51,6 C 71,8 87,20 93,43 C 98,66 88,86 70,95 C 50,102 28,93 16,77 C 6,59 9,37 21,21 C 29,11 41,5 51,6" fill="${fillColor}" stroke="${CONFIG.stroke}" stroke-width="${CONFIG.width}" stroke-linecap="round" stroke-linejoin="round"/></g><g class="features-group"><path d="M35,45 C35,35 25,35 25,45 C25,55 35,65 35,65 C35,65 45,55 45,45 C45,35 35,35 35,45 Z" fill="none" stroke="${CONFIG.stroke}" stroke-width="${CONFIG.width}" stroke-linecap="round" stroke-linejoin="round" transform="translate(-5, -5) scale(0.9) rotate(-5 35 45)"/><path d="M75,45 C75,35 65,35 65,45 C65,55 75,65 75,65 C75,65 85,55 85,45 C85,35 75,35 75,45 Z" fill="none" stroke="${CONFIG.stroke}" stroke-width="${CONFIG.width}" stroke-linecap="round" stroke-linejoin="round" transform="translate(5, -5) scale(0.9) rotate(5 75 45)"/><path d="M30,75 C45,90 65,90 80,75" fill="none" stroke="${CONFIG.stroke}" stroke-width="${CONFIG.width}" stroke-linecap="round" stroke-linejoin="round"/></g>`,
        `<g class="head-group"><path d="M49,6 C 69,8 86,20 92,43 C 97,66 87,86 68,95 C 48,102 26,93 14,77 C 4,59 7,37 20,21 C 28,11 39,5 49,6" fill="${fillColor}" stroke="${CONFIG.stroke}" stroke-width="${CONFIG.width}" stroke-linecap="round" stroke-linejoin="round"/></g><g class="features-group"><path d="M35,45 L40,45 M70,45 L75,45" fill="none" stroke="${CONFIG.stroke}" stroke-width="${CONFIG.width * 1.3}" stroke-linecap="butt" stroke-linejoin="round"/><path d="M30,75 C45,60 65,60 80,75" fill="none" stroke="${CONFIG.stroke}" stroke-width="${CONFIG.width}" stroke-linecap="round" stroke-linejoin="round"/></g>`
    ];

    // ==========================================
    // 3. 纹理生成
    // ==========================================
    function createIconImage(svgContent) {
        const svgString = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 120 120" width="480" height="480">${svgContent}</svg>`;
        const blob = new Blob([svgString], {type: 'image/svg+xml'});
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.src = url;
        return { img: img, url: url };
    }

    const normalSvgs = getSvgContent(CONFIG.fill);
    const hoverSvgs = getSvgContent(CONFIG.fillHover);

    const texturePool = normalSvgs.map((svgNormal, index) => {
        const svgHover = hoverSvgs[index];
        return {
            normal: createIconImage(svgNormal),
            hover: createIconImage(svgHover)
        };
    });

    // ==========================================
    // 4. Matter.js 引擎
    // ==========================================
    const Engine = Matter.Engine,
          Render = Matter.Render,
          Runner = Matter.Runner,
          Bodies = Matter.Bodies,
          Body = Matter.Body,
          Composite = Matter.Composite,
          Events = Matter.Events,
          Common = Matter.Common,
          Query = Matter.Query;

    const engine = Engine.create();
    engine.world.gravity.y = PARAMS.gravity;
    const world = engine.world;

    const render = Render.create({
        element: document.body,
        engine: engine,
        options: {
            width: window.innerWidth,
            height: window.innerHeight,
            background: CONFIG.bg,
            wireframes: false,
            pixelRatio: window.devicePixelRatio
        }
    });

    // ==========================================
    // 5. 鼠标排斥
    // ==========================================
    const mouseRepulsor = Bodies.circle(-1000, -1000, PARAMS.mouseRadius, {
        isStatic: true,
        render: { visible: false }
    });
    Composite.add(world, mouseRepulsor);

    let targetMouseX = -1000;
    let targetMouseY = -1000;

    document.addEventListener('mousemove', (e) => {
        targetMouseX = e.clientX;
        targetMouseY = e.clientY;
    });
    document.addEventListener('mouseleave', () => {
        targetMouseX = -1000;
        targetMouseY = -1000;
    });

    // ==========================================
    // 6. 核心逻辑循环
    // ==========================================
    
    // A. 碰撞触发消失逻辑
    Events.on(engine, 'collisionStart', function(event) {
        const pairs = event.pairs;
        const now = Date.now();
        const screenHeight = window.innerHeight;

        for (let i = 0; i < pairs.length; i++) {
            const bodyA = pairs[i].bodyA;
            const bodyB = pairs[i].bodyB;
            checkCollisionDeath(bodyA, now, screenHeight);
            checkCollisionDeath(bodyB, now, screenHeight);
        }
    });

    function checkCollisionDeath(body, now, screenHeight) {
        if (body.isStatic || !body.plugin || body.plugin.dyingPhase !== 0) return;
        const age = now - body.plugin.birthTime;
        // 存活超过1.5秒 + 在屏幕下半部分 + 小概率触发
        if (age > 1500 && body.position.y > screenHeight * 0.5) {
            if (Math.random() < 0.02) { // 2% 概率因碰撞而消失
                startDying(body);
            }
        }
    }

    // B. 随机拥挤清理逻辑 (Crowd Control)
    setInterval(() => {
        const bodies = Composite.allBodies(world);
        // 如果数量超过阈值，开始随机清理底部的图标
        if (bodies.length > PARAMS.crowdThreshold) {
            const now = Date.now();
            const screenHeight = window.innerHeight;
            
            // 每次随机检查 5 个物体
            for(let k=0; k<5; k++) {
                const body = Common.choose(bodies);
                if (body && !body.isStatic && body.plugin && body.plugin.dyingPhase === 0) {
                    const age = now - body.plugin.birthTime;
                    if (age > 3000 && body.position.y > screenHeight * 0.6) {
                        // 拥挤时，消失概率较大
                        if (Math.random() < 0.3) startDying(body);
                    }
                }
            }
        }
    }, 500); // 每0.5秒检查一次拥挤

    function startDying(body) {
        body.plugin.dyingPhase = 1;
        // 立即变红
        if (body.render.sprite.texture !== body.plugin.texPair.hover.url) {
            body.render.sprite.texture = body.plugin.texPair.hover.url;
        }
    }

    // C. 每一帧更新 (动画 + 鼠标)
    Events.on(engine, 'beforeUpdate', function() {
        // 1. 排斥球
        const currentPos = mouseRepulsor.position;
        const dx = targetMouseX - currentPos.x;
        const dy = targetMouseY - currentPos.y;
        Body.translate(mouseRepulsor, {
            x: dx * PARAMS.mouseLag, 
            y: dy * PARAMS.mouseLag
        });

        // 2. 鼠标悬停
        const bodies = Composite.allBodies(world);
        const hoveredBodies = Query.point(bodies, { x: targetMouseX, y: targetMouseY });

        for (let i = 0; i < bodies.length; i++) {
            const body = bodies[i];
            const p = body.plugin;
            if (body.isStatic || !p) continue;

            // --- 鼠标呼吸 ---
            const isHovered = hoveredBodies.includes(body);
            if (isHovered) p.isHovering = true;
            else p.isHovering = false;

            if (p.isHovering || p.pulsePhase > 0) {
                p.pulsePhase += PARAMS.pulseSpeed;
                if (p.pulsePhase >= Math.PI) {
                    if (p.isHovering) p.pulsePhase = 0; 
                    else p.pulsePhase = 0; 
                }
            }

            // --- 消失动画 ---
            if (p.dyingPhase === 1) { // 变大
                const rate = PARAMS.growSpeed; 
                Body.scale(body, rate, rate);
                p.currentScale *= rate;
                if (body.render.sprite) {
                    body.render.sprite.xScale = p.currentScale;
                    body.render.sprite.yScale = p.currentScale;
                }
                // 膨胀到预定倍数进入下一阶段
                if (p.currentScale >= p.originalScale * PARAMS.maxPopScale) {
                    p.dyingPhase = 2;
                }
            } 
            else if (p.dyingPhase === 2) { // 缩小
                const rate = PARAMS.shrinkSpeed; 
                Body.scale(body, rate, rate);
                p.currentScale *= rate;
                if (body.render.sprite) {
                    body.render.sprite.xScale = p.currentScale;
                    body.render.sprite.yScale = p.currentScale;
                }
                if (p.currentScale < 0.05) Composite.remove(world, body);
            }
        }
    });

    // ==========================================
    // 7. 渲染后处理 (鼠标悬停呼吸层)
    // ==========================================
    Events.on(render, 'afterRender', function() {
        const ctx = render.context;
        const bodies = Composite.allBodies(world);

        for (let i = 0; i < bodies.length; i++) {
            const body = bodies[i];
            const p = body.plugin;
            
            // 只有未处于消失状态的物体才显示呼吸层
            if (p && p.pulsePhase > 0 && p.dyingPhase === 0) {
                const alpha = Math.sin(p.pulsePhase); 
                const pulseScale = 1 + alpha * (PARAMS.hoverScale - 1);

                ctx.save();
                ctx.translate(body.position.x, body.position.y);
                ctx.rotate(body.angle);
                
                ctx.globalAlpha = alpha;
                const img = p.texPair.hover.img;
                if (img.complete) {
                    const size = 480; 
                    const displayScale = body.render.sprite.xScale * pulseScale;
                    ctx.scale(displayScale, displayScale);
                    ctx.drawImage(img, -size/2, -size/2, size, size);
                }
                ctx.restore();
            }
        }
    });

    // ==========================================
    // 8. 边界 & 生成
    // ==========================================
    function createBoundaries() {
        Composite.clear(world, false, true); 
        const w = window.innerWidth;
        const h = window.innerHeight;
        const t = 100;
        const ground = Bodies.rectangle(w/2, h + t/2, w, t, { isStatic: true, render: { visible: false } });
        const left = Bodies.rectangle(-t/2, h/2, t, h*5, { isStatic: true, render: { visible: false } });
        const right = Bodies.rectangle(w + t/2, h/2, t, h*5, { isStatic: true, render: { visible: false } });
        Composite.add(world, [ground, left, right, mouseRepulsor]);
        Body.set(mouseRepulsor, { circleRadius: PARAMS.mouseRadius });
    }
    createBoundaries();

    window.addEventListener('resize', () => {
        render.canvas.width = window.innerWidth;
        render.canvas.height = window.innerHeight;
        createBoundaries();
    });

    function spawn() {
        const texPair = Common.choose(texturePool);
        const size = Common.random(35, 50); 
        const scale = (size * 2) / 480;

        const x = Common.random(50, window.innerWidth - 50);
        const y = -80;

        const body = Bodies.circle(x, y, size, {
            restitution: 0.3,
            friction: 0.5,
            frictionAir: PARAMS.airResistance, 
            angle: Math.random() * Math.PI * 2,
            render: {
                sprite: {
                    texture: texPair.normal.url, 
                    xScale: scale, 
                    yScale: scale
                }
            },
            plugin: {
                birthTime: Date.now(),
                dyingPhase: 0, 
                maxScale: scale * PARAMS.maxPopScale,
                originalScale: scale,
                currentScale: scale,
                texPair: texPair,
                isHovering: false,
                pulsePhase: 0
            }
        });

        Composite.add(world, body);
    }

    // 持续生成循环 (上限设为100)
    setInterval(() => {
        if (Composite.allBodies(world).length < PARAMS.maxCount) spawn();
    }, 150);

    document.addEventListener('mousedown', spawn);
    document.addEventListener('touchstart', spawn);

    Render.run(render);
    const runner = Runner.create();
    Runner.run(runner, engine);

</script>
</body>
</html>
